<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>傳統漢服元素與現代審美融合設計 - 創作評分系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f5f0;
      color: #2b2b2b;
      -webkit-tap-highlight-color: transparent;
    }
    .font-serif-tc { font-family: 'Noto Serif TC', serif; }
    .border-cinnabar { border-color: #a83836; }
    .bg-cinnabar { background-color: #a83836; }
    .text-cinnabar { color: #a83836; }
    .bg-silk { background-color: #fdfbf7; }

    .touch-target {
      min-height: 44px;
    }

    .scroll-touch {
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    .scroll-touch::-webkit-scrollbar {
      height: 4px;
    }
    .scroll-touch::-webkit-scrollbar-thumb {
      background-color: #d6d3cb;
      border-radius: 9999px;
    }

    .level-step-btn {
      transition: all 0.2s ease;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      touch-action: manipulation;
    }
    .level-step-btn.active {
      background-color: #a83836;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 1px 3px rgba(168, 56, 54, 0.3);
    }
    .level-step-btn.inactive {
      background-color: #f3f0e6;
      color: #666;
    }
    .level-step-btn.inactive:hover {
      background-color: #e8e2d2;
      color: #222;
    }

    @media print {
      .no-print { display: none !important; }
      body { background-color: #ffffff; color: #000000; }
      .print-page-break { page-break-inside: avoid; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- 頂部導航列 -->
  <header class="bg-silk border-b border-stone-200 sticky top-0 z-30 shadow-sm no-print">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <span class="w-2.5 h-6 bg-cinnabar rounded-sm inline-block"></span>
        <div>
          <h1 class="text-base sm:text-lg font-bold font-serif-tc text-stone-800 leading-tight">漢服現代融合設計 · 創作評分系統</h1>
          <p class="text-[11px] text-stone-500">視覺藝術科 · 實體作品真實視覺分析 (iPad / 電腦通用版)</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
        <label for="apiKeyInput" class="text-xs text-stone-600 font-medium shrink-0">Gemini Key：</label>
        <input type="password" id="apiKeyInput" placeholder="請填寫 Key 以啟動真實圖片視覺辨識" 
          class="border border-stone-300 rounded px-2.5 py-1.5 text-xs w-48 sm:w-60 focus:outline-none focus:ring-1 focus:ring-red-800 bg-white shadow-inner">
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-4 sm:py-6 flex-grow w-full">

    <!-- 學生資訊列 -->
    <div class="bg-silk border border-stone-200 rounded-lg p-3 sm:p-4 mb-4 shadow-sm flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-3 sm:gap-6 text-sm w-full sm:w-auto">
        <div class="flex items-center">
          <label class="text-stone-500 font-medium mr-1 text-xs sm:text-sm">學生：</label>
          <input type="text" id="studentName" placeholder="輸入姓名" class="border-b border-stone-300 bg-transparent px-1 py-0.5 focus:border-cinnabar focus:outline-none font-medium w-24">
        </div>
        <div class="flex items-center">
          <label class="text-stone-500 font-medium mr-1 text-xs sm:text-sm">班別：</label>
          <input type="text" id="studentClass" placeholder="例如 4A" class="border-b border-stone-300 bg-transparent px-1 py-0.5 focus:border-cinnabar focus:outline-none font-medium w-20">
        </div>
        <div class="text-xs sm:text-sm text-stone-600">
          <span class="text-stone-400">主題：</span>結合傳統漢服元素與現代審美
        </div>
      </div>
      <div class="no-print w-full sm:w-auto text-right">
        <button onclick="window.print()" class="touch-target w-full sm:w-auto text-xs bg-stone-100 active:bg-stone-200 border border-stone-300 text-stone-700 px-3.5 py-2 rounded transition flex items-center justify-center gap-1.5 font-medium ml-auto">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          列印 / 匯出 PDF 報告
        </button>
      </div>
    </div>

    <!-- 設計意念與元素選取區 (預設全部清空，不預選) -->
    <div class="bg-silk border border-stone-200 rounded-lg p-4 sm:p-5 mb-6 shadow-sm">
      <h2 class="text-sm sm:text-base font-bold font-serif-tc text-stone-800 mb-3 flex items-center justify-between">
        <span class="flex items-center"><span class="w-2 h-2 bg-cinnabar rounded-full mr-2"></span>設計意念與元素選取</span>
        <span class="text-[11px] text-stone-400 font-normal">請勾選該作品實際運用的元素</span>
      </h2>
      
      <div class="space-y-4 text-xs">
        
        <!-- 傳統漢服特色選取 -->
        <div class="border border-stone-200 bg-white rounded p-3">
          <span class="font-bold text-stone-800 block mb-2 text-[13px]">1. 傳統漢服特色選取（可複選）：</span>
          
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
            <div class="bg-stone-50/70 p-2.5 rounded border border-stone-100">
              <span class="font-bold text-cinnabar block mb-1.5">a. 秦漢時期</span>
              <div class="space-y-1.5">
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="hanfu_element" value="秦漢-交領右衽" class="w-4 h-4 rounded text-red-800">交領右衽</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="hanfu_element" value="秦漢-袖口緣邊" class="w-4 h-4 rounded text-red-800">袖口緣邊</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="hanfu_element" value="秦漢-直裾下擺" class="w-4 h-4 rounded text-red-800">直裾下擺</label>
              </div>
            </div>

            <div class="bg-stone-50/70 p-2.5 rounded border border-stone-100">
              <span class="font-bold text-cinnabar block mb-1.5">b. 魏晉南北朝</span>
              <div class="space-y-1.5">
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="hanfu_element" value="魏晉-窄袖襦" class="w-4 h-4 rounded text-red-800">窄袖襦</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="hanfu_element" value="魏晉-襦裙分層" class="w-4 h-4 rounded text-red-800">襦裙分層</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="hanfu_element" value="魏晉-及地長裙" class="w-4 h-4 rounded text-red-800">及地長裙</label>
              </div>
            </div>

            <div class="bg-stone-50/70 p-2.5 rounded border border-stone-100">
              <span class="font-bold text-cinnabar block mb-1.5">c. 唐代</span>
              <div class="space-y-1.5">
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="hanfu_element" value="唐代-交領小袖" class="w-4 h-4 rounded text-red-800">交領小袖</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="hanfu_element" value="唐代-高束裙腰" class="w-4 h-4 rounded text-red-800">高束裙腰</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="hanfu_element" value="唐代-垂背披帛" class="w-4 h-4 rounded text-red-800">垂背披帛</label>
              </div>
            </div>

            <div class="bg-stone-50/70 p-2.5 rounded border border-stone-100">
              <span class="font-bold text-cinnabar block mb-1.5">d. 宋代</span>
              <div class="space-y-1.5">
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="hanfu_element" value="宋代-直領對襟" class="w-4 h-4 rounded text-red-800">直領對襟</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="hanfu_element" value="宋代-窄袖緣邊" class="w-4 h-4 rounded text-red-800">窄袖緣邊</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="hanfu_element" value="宋代-側衩與內層" class="w-4 h-4 rounded text-red-800">側衩與內層</label>
              </div>
            </div>

            <div class="bg-stone-50/70 p-2.5 rounded border border-stone-100 md:col-span-2">
              <span class="font-bold text-cinnabar block mb-1.5">e. 明代</span>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="hanfu_element" value="明代-直領對襟" class="w-4 h-4 rounded text-red-800">直領對襟</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="hanfu_element" value="明代-長短袖疊穿" class="w-4 h-4 rounded text-red-80
